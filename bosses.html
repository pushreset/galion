<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boss · revue des modèles</title>
<link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0c2140; }
  #c { display: block; image-rendering: pixelated; cursor: grab; }
  .hud { position: fixed; font: 12px/1.6 'Silkscreen', monospace; color: #f5ecd2; text-shadow: 2px 2px 0 #1b110b; }
  .panel { background: #3f2616; border: 3px solid #1b110b; box-shadow: inset 0 0 0 3px #8d5c35; padding: 10px 14px; }
  #card { left: 16px; top: 16px; width: min(380px, calc(100vw - 60px)); }
  #card h1 { font-size: 20px; margin: 0; color: #ffd24a; }
  #card h2 { font-size: 12px; margin: 0 0 6px; color: #e3c088; font-weight: 400; }
  #card p { margin: 6px 0; font-family: Georgia, serif; font-size: 14px; line-height: 1.4; text-shadow: none; }
  #card b { color: #ffd24a; font-family: 'Silkscreen', monospace; font-size: 11px; }
  #card small { color: #cc9d63; }
  #nav { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
  #nav button { font: inherit; color: inherit; background: #56351f; border: 2px solid #1b110b; padding: 0 10px; cursor: pointer; }
  #nav span { flex: 1; }
  #help { left: 16px; bottom: 16px; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="card" class="hud panel"></div>
<div id="help" class="hud">← → boss · glisser : tourner · O orbite · G galion (échelle) · K kraken · Z zoom</div>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }</script>
<script type="module">
// Review page for the boss models: the game's own pipeline (game.js renderer, camera, lights, post.js, water.js), no gameplay.
import * as THREE from 'three';
import { PixelPost } from './post.js';
import { createSea } from './water.js';
import { ISLANDS } from './sim.js';
import { buildShip } from './ships.js';
import { BOSSES, buildBoss } from './bosses.js';

const TARGET_PX_H = 300, CAM_AZ = Math.PI / 4, CAM_EL = (38 * Math.PI) / 180, WIND_A = 0.6; // game.js
const ZOOMS = [40, 24, 64]; // 40 = what a run shows

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.BasicShadowMap;
renderer.info.autoReset = false; // count the whole frame (shadow pass, scene, post quad), not just the last pass
const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 1, 400);
const post = new PixelPost(renderer, camera.near, camera.far);
scene.add(new THREE.HemisphereLight('#fff6ea', '#8fa6b0', 0.6 * Math.PI));
const sun = new THREE.DirectionalLight('#fff1d8', 0.62 * Math.PI);
sun.position.set(-22, 80, 50);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -50, right: 50, top: 50, bottom: -50, near: 1, far: 260 });
sun.shadow.bias = -0.0008;
scene.add(sun, sun.target);

ISLANDS.length = 0; // open sea: no shallows under the model
const sea = createSea();
sea.uWind.value.set(Math.cos(WIND_A), Math.sin(WIND_A));
scene.add(sea.mesh);

let az = CAM_AZ, zoom = 0, iw = 2, ih = 2;
function setCamera() {
  const d = new THREE.Vector3(Math.cos(CAM_EL) * Math.cos(az), Math.sin(CAM_EL), Math.cos(CAM_EL) * Math.sin(az));
  const lift = ZOOMS[zoom] * 0.16; // aim above the waterline: masts fit, the card's corner stays clear
  camera.position.copy(d).multiplyScalar(200).setY(d.y * 200 + lift);
  camera.lookAt(0, lift, 0);
}
function resize() {
  const f = Math.max(1, Math.round(innerHeight / TARGET_PX_H));
  iw = Math.ceil(innerWidth / f); ih = Math.ceil(innerHeight / f);
  post.setSize(iw, ih);
  canvas.style.width = iw * f + 'px'; canvas.style.height = ih * f + 'px';
  const viewH = ZOOMS[zoom], texel = viewH / ih;
  Object.assign(camera, { left: (-iw * texel) / 2, right: (iw * texel) / 2, top: viewH / 2, bottom: -viewH / 2 });
  camera.updateProjectionMatrix();
  setCamera();
}
addEventListener('resize', resize);

let cur = Math.min(BOSSES.length, Math.max(1, +new URLSearchParams(location.search).get('b') || 1)) - 1;
let mesh, ref, orbit = !new URLSearchParams(location.search).has('still'), showRef = true, kraken = false, t = 0;
const galleon = buildShip('galleon', 'pirate');
scene.add(galleon.root);

function show(i) {
  cur = (i + BOSSES.length) % BOSSES.length;
  if (mesh) {
    scene.remove(mesh.root);
    mesh.root.traverse((o) => o.geometry?.dispose());
  }
  const b = BOSSES[cur];
  mesh = kraken ? buildShip('kraken') : buildBoss(b.id);
  scene.add(mesh.root);
  const off = (Math.max(mesh.spec.L, mesh.spec.B) / 2 + 6) * Math.SQRT1_2;
  galleon.root.position.set(-off, 0, off); // beside her on screen at the game's angle, bow the same way
  galleon.root.visible = showRef;
  history.replaceState(null, '', '?b=' + (cur + 1));
  tick(0);
  const { calls, triangles } = renderer.info.render;
  document.getElementById('card').innerHTML = kraken
    ? `<div id="nav"><span>RÉFÉRENCE</span></div><h1>LE KRAKEN</h1><h2>boss actuel du jeu</h2><p>Le niveau de détail à égaler. K pour revenir.</p>`
    : `<div id="nav"><button data-d="-1">◀</button><span>BOSS ${cur + 1} / ${BOSSES.length}</span><button data-d="1">▶</button></div>
       <h1>${b.name}</h1><h2>${b.title} · ${b.origin}</h2><p>${b.lore}</p><p><b>MODÈLE</b> ${b.look}</p><p><b>EN JEU</b> ${b.play}</p>
       <small>${mesh.spec.L} × ${mesh.spec.B} unités (galion : 14 × 4,2) · scène : ${calls} draw calls, ${triangles} triangles</small>`;
}

function sway(m, seed) { // game.js syncShip, at rest
  if (m.still) return;
  m.body.position.y = Math.sin(t * 1.4 + seed) * 0.12 - 0.05;
  m.body.rotation.x = Math.sin(t * 1.1 + seed) * 0.035;
  m.body.rotation.z = Math.sin(t * 0.9 + seed * 2) * 0.025;
  m.flag.rotation.y = Math.PI - WIND_A + Math.sin(t * 4 + seed) * 0.3;
  for (const r of m.rigs) r.rotation.y = -WIND_A * 0.55;
}
function tick(dt) {
  t += dt;
  if (orbit && dt) { az += dt * 0.12; setCamera(); }
  sea.uTime.value = t;
  sway(galleon, 1);
  sway(mesh, 3);
  if (mesh.arms) mesh.arms.forEach((a, i) => (a.rotation.z = Math.sin(t * 1.8 + i * 1.3) * 0.3)); // the kraken, as in game.js
  mesh.anim?.(t);
  renderer.info.reset();
  post.render(scene, camera);
}

addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (k === 'arrowright') show(cur + 1);
  else if (k === 'arrowleft') show(cur - 1);
  else if (k === 'o') { orbit = !orbit; if (!orbit) { az = CAM_AZ; setCamera(); } }
  else if (k === 'g') { showRef = !showRef; galleon.root.visible = showRef; }
  else if (k === 'k') { kraken = !kraken; show(cur); }
  else if (k === 'z') { zoom = (zoom + 1) % ZOOMS.length; resize(); }
});
document.getElementById('card').addEventListener('click', (e) => e.target.dataset.d && show(cur + +e.target.dataset.d));
let drag = null;
canvas.addEventListener('pointerdown', (e) => { drag = e.clientX; orbit = false; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', (e) => { if (drag !== null) { az += (e.clientX - drag) * 0.008; drag = e.clientX; setCamera(); } });
canvas.addEventListener('pointerup', () => (drag = null));

resize();
show(cur);
let last = performance.now();
(function frame(now) {
  tick(Math.min(0.05, (now - last) / 1000));
  last = now;
  requestAnimationFrame(frame);
})(last);
// qa/shot.mjs drives this page like the game: URL=…/bosses.html?b=3&still node qa/shot.mjs out.png 2
window.__game = { turn: (a) => { az = a; setCamera(); }, advance: (s) => { for (let i = 0; i < s * 30; i++) tick(1 / 30); }, info: () => ({ boss: BOSSES[cur].id, ...renderer.info.render }) };
window.__ready = true;
</script>
</body>
</html>
