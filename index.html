<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Broadside</title>
<!-- the title screen's skull (screens.js SKULL) on the page's sea, one unit per pixel at 16 px -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'><path fill='%230c2140' d='M0 0h16v16h-16z'/><path fill='%23f5ecd2' transform='translate(2 4)' d='M3 0h6v1h-6z M2 1h8v1h-8z M1 2h10v1h-10z M1 3h1v2h-1z M4 3h4v2h-4z M10 3h1v2h-1z M1 5h10v1h-10z M2 6h3v1h-3z M7 6h3v1h-3z M3 7h6v1h-6z M3 8h1v1h-1z M5 8h2v1h-2z M8 8h1v1h-1z'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<link href="broadside-ui.css" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0c2140; }
  #c { display: block; image-rendering: pixelated; }
  .hud { position: fixed; font: 16px 'Silkscreen', monospace; color: #f5ecd2; text-shadow: 2px 2px 0 #1b110b; pointer-events: none; }
  .panel { background: #3f2616; border: 3px solid #1b110b; box-shadow: inset 0 0 0 3px #8d5c35; padding: 8px 12px; }
  #help { left: 16px; bottom: 16px; font-size: 12px; line-height: 1.6; }
  #stats { left: 16px; top: 16px; display: grid; grid-template-columns: auto 160px; gap: 6px 10px; align-items: center; font-size: 12px; }
  .bar { height: 10px; background: #1b110b; border: 2px solid #1b110b; }
  .bar i { display: block; height: 100%; width: 0; }
  #hp { background: #d84a38; } #sail { background: #f5ecd2; } #rp, #rs { background: #3aa0c6; } #crew { background: #ddcda6; } #crewn { font-weight: normal; color: #ffd24a; } #hp.fix { background: #94c54c; }
  kbd { color: #ffd24a; }
  #score { right: 16px; top: 16px; text-align: right; font-size: 14px; line-height: 1.6; }
  #score b { color: #ffd24a; font-weight: normal; }
  #combo { color: #ff8a3a; }
  #combo .bar { width: 100px; height: 6px; margin-left: auto; }
  #combo .bar i { background: #ff8a3a; }
  #combo[hidden] { display: none; }
  #banner { left: 50%; top: 22%; transform: translateX(-50%); font-size: 28px; padding: 10px 22px; white-space: nowrap; }
  #cards { left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; }
  #cards h2 { margin: 0 0 10px; font: inherit; font-size: 18px; }
  #cards-list { display: flex; gap: 12px; }
  .card { width: 150px; padding: 14px 10px; background: #56351f; border: 3px solid #1b110b; box-shadow: inset 0 0 0 3px #ad7a48; font-size: 13px; line-height: 1.5; display: grid; gap: 8px; }
  #cards .card { pointer-events: auto; cursor: pointer; }
  #cards .card:hover { box-shadow: inset 0 0 0 3px #ffd24a; }
  .card kbd { font-size: 22px; }
  .card .icon { width: 32px; height: 32px; image-rendering: pixelated; justify-self: center; }
  #cards[hidden], #banner[hidden], #boarding[hidden], #board-hint[hidden] { display: none; }
  #boarding { left: 50%; top: 50%; transform: translate(-50%, -50%); width: 420px; display: grid; gap: 10px; text-align: center; }
  #boarding h2 { margin: 0; font: inherit; font-size: 24px; color: #ffd24a; }
  .b-row { display: grid; grid-template-columns: 110px 1fr 36px; gap: 8px; align-items: center; font-size: 12px; text-align: left; }
  .b-row b { font-weight: normal; text-align: right; }
  #b-you { background: #f5ecd2; } #b-them { background: #d84a38; }
  #b-line { position: relative; height: 28px; background: #1b110b; border: 3px solid #1b110b; box-shadow: inset 0 0 0 2px #8d5c35; overflow: hidden; }
  #b-line i { position: absolute; top: 0; bottom: 0; }
  #b-zone { width: 50%; background: #56351f; }
  #b-target { width: 8%; background: #ffd24a; }
  #b-cursor { width: 4px; margin-left: -2px; background: #f4fffb; box-shadow: 0 0 0 2px #1b110b; }
  #b-time { background: #3aa0c6; }
  #b-msg { min-height: 18px; font-size: 14px; color: #ffd24a; }
  .b-help { font-size: 11px; color: #ddcda6; }
  #board-hint { position: absolute; left: 0; top: 0; font-size: 12px; color: #ffd24a; background: #1b110b; padding: 2px 6px; white-space: nowrap; }
  #radar-box { right: 16px; bottom: 16px; padding: 0; background: none; border: 0; box-shadow: none; }
  #radar { display: block; width: 224px; height: 224px; image-rendering: pixelated; }
  #bars { inset: 0; }
  .ebar { position: absolute; left: 0; top: 0; width: 48px; height: 6px; background: #1b110b; border: 2px solid #1b110b; }
  .ebar i { display: block; height: 100%; background: #d84a38; }
  .ebar[hidden] { display: none; }
  .ebar.m i { background: #f5ecd2; } .ebar.k i { background: #a552ad; }
  .pop { position: absolute; transform: translate(-50%, -50%); color: #ffd24a; font-size: 18px; animation: pop 1.2s steps(12) forwards; }
  .pop.combo { color: #ff7a2a; font-size: 26px; margin-top: -28px; }
  @keyframes pop { to { transform: translate(-50%, -250%); opacity: 0; } }
  #skills { right: 256px; bottom: 34px; display: flex; gap: 10px; }
  .slot { position: relative; width: 56px; height: 56px; background: #56351f; border: 3px solid #1b110b; box-shadow: inset 0 0 0 3px #ad7a48; display: grid; place-items: center; }
  .slot img { width: 40px; height: 40px; image-rendering: pixelated; }
  .slot .cd { position: absolute; left: 3px; right: 3px; bottom: 3px; height: 0; background: rgba(27, 17, 11, 0.72); }
  .slot kbd { position: absolute; left: 3px; top: 0; font-size: 12px; }
  .slot em { position: absolute; right: 4px; bottom: 1px; font-style: normal; font-size: 10px; color: #ffd24a; }
  .slot span { position: absolute; top: calc(100% + 4px); left: 50%; transform: translateX(-50%); font-size: 8px; white-space: nowrap; }
  .slot.armed { border-color: #ffd24a; box-shadow: inset 0 0 0 3px #ff9b26; }
  .slot.locked { opacity: 0.5; } .slot.locked b { font-size: 22px; font-weight: normal; color: #b9a57d; }
  body.selecting #stats, body.selecting #score, body.selecting #radar-box, body.selecting #skills { display: none; }
  body.menus #help, body.menus #room, #help[hidden] { display: none; } /* a menu screen is open (ui.js) */
  #room { left: 50%; top: 16px; transform: translateX(-50%); font-size: 12px; text-align: center; line-height: 1.6; }
  #room b { color: #ffd24a; font-weight: normal; font-size: 16px; }
  #room[hidden], #coop[hidden], #pvp[hidden] { display: none; }
  .ebar.p i { background: #94c54c; } .ebar.e i { background: #ff7a2a; }
  .ebar.self { background: none; border-color: transparent; } .ebar.self i { display: none; }
  .ebar.p::before, .ebar.e::before, .ebar.self::before { content: attr(data-tag); position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); font-size: 10px; color: #f5ecd2; }
</style>
<script defer src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js" integrity="sha384-nlUQ8ZqCbvStErob+biJNzSgltf6urV3VGqhfIfzhmg9RXmpeRm76ELw0pYnKlTR" crossorigin="anonymous"></script>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
</head>
<body class="selecting">
<canvas id="c"></canvas>
<div id="ui" class="bs-ui"><div id="ui-veil"></div><div id="ui-stage"><div id="ui-screen"></div><div id="ui-hints" class="bs-hints"></div><div id="ui-modal"></div><div id="ui-toasts"></div></div></div>
<div id="room" class="hud panel" hidden></div>
<div id="stats" class="hud panel">
  <span>HULL</span><div class="bar"><i id="hp"></i></div>
  <span>SAIL</span><div class="bar"><i id="sail"></i></div>
  <span><kbd id="k-port"></kbd> PORT</span><div class="bar"><i id="rp"></i></div>
  <span><kbd id="k-star"></kbd> STAR</span><div class="bar"><i id="rs"></i></div>
  <span>CREW <b id="crewn"></b></span><div class="bar"><i id="crew"></i></div>
</div>
<div id="score" class="hud panel"><div id="pvp" hidden></div><div id="coop">GOLD <b id="gold">0</b><br><span id="wave-l">WAVE</span> <b id="wave">0</b><span id="navy" hidden><br>NAVY GOLD <b id="delivered">0</b></span></div><div id="combo" hidden>COMBO <b id="combo-n"></b><div class="bar"><i id="combo-t"></i></div></div></div>
<div id="bars" class="hud"><div id="board-hint" hidden></div></div>
<div id="skills" class="hud"></div>
<div id="radar-box" class="hud"><canvas id="radar"></canvas></div>
<div id="banner" class="hud panel" hidden></div>
<div id="boarding" class="hud panel" hidden>
  <h2 id="b-title">BOARDING!</h2>
  <div class="b-row"><span>YOUR CREW</span><div class="bar"><i id="b-you"></i></div><b id="b-youn"></b></div>
  <div class="b-row"><span>DEFENDERS</span><div class="bar"><i id="b-them"></i></div><b id="b-themn"></b></div>
  <div id="b-line"><i id="b-zone"></i><i id="b-target"></i><i id="b-cursor"></i></div>
  <div class="bar" id="b-timebar"><i id="b-time"></i></div>
  <div id="b-msg"></div>
  <div class="b-help"><kbd id="k-board"></kbd> when the cursor is on the gold mark</div>
</div>
<div id="cards" class="hud panel" hidden><h2 id="cards-h"></h2><div id="cards-list"></div></div>
<div id="help" class="hud panel"></div>
<script type="module" src="game.js"></script>
</body>
</html>
